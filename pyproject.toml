[project]
name = "api-agent"
version = "0.1.0"
description = "Universal MCP server for querying GraphQL and REST APIs using natural language"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "API Agent Contributors" }]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.3",
    "fastmcp>=3.3.1,<4",
    "httpx>=0.28.1",
    "openai-agents>=0.17.4",
    "openinference-instrumentation-openai-agents>=1.5.1",
    "opentelemetry-api==1.41.0",
    "opentelemetry-distro[otlp]==0.62b0",
    "opentelemetry-instrumentation==0.62b0",
    "opentelemetry-sdk==1.41.0",
    "opentelemetry-semantic-conventions==0.62b0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.5",
    "redis>=8.0.0",
    "starlette>=1.2.0",
    "uvicorn>=0.48.0",
]

[project.scripts]
api-agent = "api_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api_agent"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E402"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.15",
    "ty>=0.0.40",
]
